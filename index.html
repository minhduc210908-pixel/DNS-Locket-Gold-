<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config duy trì Locket Gold</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Khối Config duy trì Locket Gold y nguyên bản gốc -->
        <div class="mt-6 bg-gray-50 rounded-xl p-5 border border-gray-200 text-gray-900 shadow-2xl">
            <h2 class="text-xl font-semibold mb-3 flex items-center text-gray-900">
                <i data-feather="heart" class="mr-2 text-red-500"></i>
                <span data-i18n="locket-cfg-title">Config duy trì Locket Gold</span>
            </h2>
            <p class="text-sm text-gray-600 mb-4" data-i18n="locket-cfg-desc">
                Cài đặt Config này sau khi đã kích hoạt Locket Gold thành công.
            </p>
            <a href="https://module-ios.netlify.app/assets/LocketGold.mobileconfig" 
               download 
               class="w-full bg-gradient-to-r from-amber-400 to-yellow-300 hover:from-amber-600 hover:to-amber-500 focus:ring-2 focus:ring-amber-300 focus:outline-none text-black font-semibold py-3 px-4 rounded-lg transition-all inline-flex items-center justify-center gap-2 shadow-md">
                <i data-feather="settings" class="w-5 h-5"></i>
                <span data-i18n="btn-install-cfg">Cài đặt Config</span>
            </a>
        </div>
    </div>

    <!-- Khởi tạo Feather Icons -->
    <script>
        feather.replace();
    </script>
</body>
</html>
